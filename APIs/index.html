<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API ViaCEP</title>
</head>
<body>
    <h1>Consulta ViaCEP</h1>
    <input type="text" id="cep" placeholder="Digite o CEP">
    <button onclick="consultarCEP()">Consultar</button>
    <p id="resultado"></p>
    <script>
        function consultarCEP() {
            const cep = document.getElementById("cep").value;
            fetch("https://viacep.com.br/ws/" + cep + "/json/")
                .then(r => r.json())
                .then(d => {
                    if (d.erro) {
                        document.getElementById("resultado").innerHTML = "CEP não encontrado!";
                    } else {
                        document.getElementById("resultado").innerHTML =
                            "Rua: " + d.logradouro + "<br>" +
                            "Cidade: " + d.localidade + "<br>" +
                            "Estado: " + d.uf;
                        console.log(d.logradouro);
                        console.log(d.localidade);
                        console.log(d.uf);
                    }
                })
                .catch(() => {
                    document.getElementById("resultado").innerHTML = "Erro ao consultar o CEP.";
                });
        }
    </script>
</body>
</html>
